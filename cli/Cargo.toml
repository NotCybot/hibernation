[package]
name = "hibernation"
version = "0.4.2"
edition = "2024"
description = "A CLI for the hibernation nix cache"
repository = "https://github.com/Profiidev/hibernation"
license = "GPL-2.0-only"

[dependencies]
async-compression = { version = "0.4.42", features = ["tokio", "zstd"] }
bytes = "1.11.1"
centaurus = { version = "0.17.7", default-features = false, features = [
  "error",
  "logging",
  "reqwest",
  "serde_json",
  "url"
] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
dirs = "6.0.0"
harmonia-protocol = { git = "https://github.com/nix-community/harmonia", rev = "harmonia-v3.0.0" }
harmonia-store-core = { git = "https://github.com/nix-community/harmonia", rev = "harmonia-v3.0.0" }
harmonia-store-remote = { git = "https://github.com/nix-community/harmonia", rev = "harmonia-v3.0.0" }
indicatif = "0.18.4"
opener = "0.8.4"
reqwest = { version = "0.13.4", features = ["form", "http3", "json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
shared = { path = "../shared" }
tokio = { version = "1.52.3", features = [
  "fs",
  "io-std",
  "macros",
  "rt-multi-thread",
  "time"
] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }

# Optional deps only used by the `e2e` integration test (tests/e2e.rs), which runs the real backend in-process.
# Dev-dependencies can not be optional and the nix build has no backend sources, so they live here behind a feature.
backend = { path = "../backend", features = ["test"], optional = true }
base64 = { version = "0.23.0", optional = true }
rsa = { version = "0.9.10", optional = true }
testcontainers-modules = { version = "=0.15.0", features = ["postgres"], optional = true }

[features]
e2e = ["dep:backend", "dep:base64", "dep:rsa", "dep:testcontainers-modules"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["test-util"] }
wiremock = "0.6.5"
