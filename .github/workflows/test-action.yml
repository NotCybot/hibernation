name: Test Setup Action
on:
  pull_request:

jobs:
  unit-test:
    name: Unit test setup action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bahmutov/npm-install@v1
      - name: Run unit tests
        run: cd action && npm run test:coverage
      - name: Check dist is up to date
        run: |
          cd action && npm run build
          git diff --exit-code -- dist/index.cjs

  test-setup:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
        version:
          - v0.1.0
          - latest
    name: Test Setup Action on ${{ matrix.os }} with version ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Cli
        uses: ./
        with:
          version: ${{ matrix.version }}
          url: https://cache.example.com
          token: test1234
          signing-key: test5678

      - name: Verify Installation
        if: matrix.version != 'latest'
        run: |
          RAW_VERSION=${{ matrix.version }}
          VERSION="${RAW_VERSION#v}"
          hibernation --version | grep $VERSION

      - name: Verify Latest Installation
        if: matrix.version == 'latest'
        run: |
          hibernation --version

      - name: Verify Signing Key
        run: |
          echo $HIBERNATION_SIGNING_KEY | grep "test5678"
