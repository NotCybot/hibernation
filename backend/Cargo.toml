[package]
name = "backend"
version = "0.4.2"
edition = "2024"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
aide = { version = "0.16.0-alpha.4", features = [
  "axum",
  "axum-extra",
  "axum-extra-cookie",
  "axum-extra-headers",
  "axum-json",
  "axum-query",
  "axum-tokio",
  "axum-ws",
  "macros"
] }
axum = { version = "0.8.9", features = ["macros", "tracing", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
centaurus = { version = "0.17.7", features = ["uuid", "storage"] }
chrono = "0.4.45"
dashmap = "6.2.1"
dotenvy = "0.15.7"
entity = { path = "entity" }
figment = { version = "0.10.19", features = ["env"] }
futures-util = "0.3.33"
harmonia-store-core = { git = "https://github.com/nix-community/harmonia", rev = "harmonia-v3.0.0" }
http = "1.5.0"
# Required to enable image formats
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "png",
  "webp"
] }
migration = { path = "migration" }
object_store = { version = "0.14.2", default-features = false }
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["form", "http3", "json"] }
schemars = { version = "1.2.2", features = ["chrono04", "url2", "uuid1"] }
sea-orm = { version = "2.0.1", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite"
] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
shared = { path = "../shared" }
time = "0.3.55"
tokio = { version = "1.53.1", features = ["signal"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower_governor = { version = "0.8.0", default-features = false, features = [
  "axum"
] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "v7"] }
zstd = "0.14.0"

[features]
test = ["centaurus/test"]

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread"] }
tower = { version = "=0.5.3", features = ["util"] }
reqwest = { version = "=0.13.5", features = ["form", "json"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"
rsa = "=0.9.10"
uuid = { version = "=1.28.0", features = ["v4"] }
tempfile = "=3.27.0"
wiremock = "=0.6.5"
ed25519-compact = "=2.6.0"
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
